<!DOCTYPE html>
<html lang="vi">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quản lý điểm — Hệ thống QLSV</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>

    <body>

        <!-- NAVBAR -->
        <div class="navbar">
            <div class="brand"> Hệ thống QLSV</div>
            <div class="nav-links">
                <a href="/dashboard">Dashboard</a>
                <a href="#" onclick="logout()">Đăng xuất</a>
            </div>
        </div>

        <!-- NỘI DUNG -->
        <div class="container">
            <div class="card">
                <h2>✏️ Quản lý điểm sinh viên</h2>

                <!-- Chọn môn học -->
                <div class="form-group" style="max-width:400px;">
                    <label for="courseSelect">Chọn môn học</label>
                    <select id="courseSelect" onchange="loadCourseGrades()">
                        <option value="">-- Chọn môn --</option>
                        {% for c in courses %}
                        <option value="{{ c.id }}">{{ c.course_code }} — {{ c.course_name }} ({{ c.semester }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div id="alert" class="alert"></div>

                <table id="gradesTable" style="display:none;">
                    <thead>
                        <tr>
                            <th>MSSV</th>
                            <th>Họ tên</th>
                            <th>KT 1</th>
                            <th>KT 2</th>
                            <th>Tổng kết</th>
                            <th>Điểm TB</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="gradesBody"></tbody>
                </table>
            </div>
        </div>

        <script>
            async function loadCourseGrades() {
                const courseId = document.getElementById('courseSelect').value;
                if (!courseId) return;

                const table = document.getElementById('gradesTable');
                const tbody = document.getElementById('gradesBody');
                const alertDiv = document.getElementById('alert');

                try {
                    const res = await fetch('/api/courses/' + courseId + '/grades');
                    const data = await res.json();

                    if (!res.ok) {
                        alertDiv.className = 'alert alert-error';
                        alertDiv.textContent = data.error;
                        alertDiv.style.display = 'block';
                        table.style.display = 'none';
                        return;
                    }

                    alertDiv.style.display = 'none';
                    tbody.innerHTML = '';

                    data.grades.forEach(function (g) {
                        const tr = document.createElement('tr');
                        tr.innerHTML =
                            '<td>' + g.mssv + '</td>' +
                            '<td>' + g.student_name + '</td>' +
                            '<td><input type="number" step="0.1" min="0" max="10" value="' + (g.score_mid1 || '') + '" id="mid1_' + g.grade_id + '" style="width:60px;"></td>' +
                            '<td><input type="number" step="0.1" min="0" max="10" value="' + (g.score_mid2 || '') + '" id="mid2_' + g.grade_id + '" style="width:60px;"></td>' +
                            '<td><input type="number" step="0.1" min="0" max="10" value="' + (g.score_final || '') + '" id="final_' + g.grade_id + '" style="width:60px;"></td>' +
                            '<td><strong>' + (g.score_weighted || '-') + '</strong></td>' +
                            '<td><button class="btn btn-primary btn-sm" onclick="saveGrade(' + g.grade_id + ')">Lưu</button></td>';
                        tbody.appendChild(tr);
                    });

                    table.style.display = 'table';
                } catch (err) {
                    alertDiv.className = 'alert alert-error';
                    alertDiv.textContent = 'Lỗi kết nối server';
                    alertDiv.style.display = 'block';
                }
            }

            async function saveGrade(gradeId) {
                const score_mid1 = parseFloat(document.getElementById('mid1_' + gradeId).value) || null;
                const score_mid2 = parseFloat(document.getElementById('mid2_' + gradeId).value) || null;
                const score_final = parseFloat(document.getElementById('final_' + gradeId).value) || null;

                const res = await fetch('/api/grades/' + gradeId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ score_mid1, score_mid2, score_final })
                });
                const data = await res.json();
                const alertDiv = document.getElementById('alert');

                if (res.ok) {
                    alertDiv.className = 'alert alert-success';
                    alertDiv.textContent = data.message;
                    alertDiv.style.display = 'block';
                    // Reload để tính lại điểm TB
                    loadCourseGrades();
                } else {
                    alertDiv.className = 'alert alert-error';
                    alertDiv.textContent = data.error;
                    alertDiv.style.display = 'block';
                }
            }

            async function logout() {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/login';
            }
        </script>

    </body>

</html>
