version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 070805
      POSTGRES_DB: web_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Web/database.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  web:
    build: .
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: web_db
      DB_USER: postgres
      DB_PASSWORD: 070805
      SECRET_KEY: SUPER_SECRET_KEY
    depends_on:
      - db

volumes:
  postgres_data: